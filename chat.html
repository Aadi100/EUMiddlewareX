<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        ui: ['Segoe UI', 'Inter', 'system-ui', 'Arial'] 
                    },
                    colors: {
                        chat: '#ffffff',
                        meta: '#667781',
                        border: 'rgba(0,0,0,.06)'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: #efeae2;
            font-family: 'Segoe UI', 'Inter', system-ui, Arial;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 128, 105, 0.3);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 128, 105, 0.5);
        }
        
        /* Animation for new messages */
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .chat-container {
            max-height: 100vh;
            overflow-y: auto;
            padding: 1rem;
        }
    </style>
</head>
<body class="text-[#111b21] font-ui">
    <div class="chat-container" id="chat-container">
        <!-- Messages will be added here dynamically -->
    </div>

    <script>
        // Function to add a new message
        function addMessage(icon, message) {
            const chatContainer = document.getElementById('chat-container');
            const now = new Date();
            const timestamp = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            const newMessage = document.createElement('div');
            newMessage.className = 'flex justify-start fade-in mb-2';
            newMessage.innerHTML = `
                <div class="relative max-w-[90%] bg-white border border-gray-200 rounded-xl shadow-sm px-3 py-2">
                    <span class="mr-1">${icon}</span> ${message}
                    <div class="mt-1 flex justify-end text-[11px] text-gray-500">${timestamp}</div>
                </div>
            `;
            
            chatContainer.appendChild(newMessage);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            return true;
        }

        // Function to clear all messages
        function clearMessages() {
            const chatContainer = document.getElementById('chat-container');
            chatContainer.innerHTML = '';
            return true;
        }

        // Add some initial messages to demonstrate the chat
        addMessage('👋', 'AI Assistant initialized successfully');
        addMessage('✅', 'System is ready to receive attendance logs');
        addMessage('💻', 'Middleware connected to attendance devices');
    </script>
</body>
</html>
